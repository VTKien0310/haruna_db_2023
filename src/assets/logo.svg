<svg 
  xmlns="http://www.w3.org/2000/svg" 
  viewBox="0 0 64 64" 
  width="64" 
  height="64" 
  fill="none"
>
  <defs>
    <!-- Foundation Strata: Oceanic Indigo to Royal Blue -->
    <linearGradient id="harunaNavy" x1="16" y1="52" x2="48" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="55%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Canopy Strata: Deep Spruce to Malachite Teal -->
    <linearGradient id="harunaTeal" x1="48" y1="12" x2="16" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#042F2E" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Focal Core: Solar Amber Nucleus -->
    <radialGradient id="harunaCore" cx="31" cy="31" r="5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>
  </defs>

  <!-- Haruna Digital Book: Color Emblem -->
  
  <!-- Foundation Cradle (Lower Basin) -->
  <path 
    d="M 17 24 
       C 14 36 21 48 34 50 
       C 45 52 51 44 49 35 
       C 47 27 40 28 35 33 
       C 29 38 22 39 19 32 
       C 17.8 29.5 17.2 26.8 17 24 Z" 
    fill="url(#harunaNavy)"
  />

  <!-- Sheltering Canopy (Upper Ridge) -->
  <path 
    d="M 47 40 
       C 50 28 43 16 30 14 
       C 19 12 13 20 15 29 
       C 17 37 24 36 29 31 
       C 35 26 42 25 45 32 
       C 46.2 34.5 46.8 37.2 47 40 Z" 
    fill="url(#harunaTeal)"
  />

  <!-- Center Nucleus (Stored Knowledge / Core) -->
  <circle 
    cx="32" 
    cy="32" 
    r="4.8" 
    fill="url(#harunaCore)"
  />
</svg>
